<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Cloud Code architecture">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="16" fill="#020617"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#e2e8f0">
    <rect x="40" y="100" width="120" height="56" rx="10" fill="url(#box)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="68" y="133" text-anchor="middle">CLI</text>
    <rect x="200" y="100" width="140" height="56" rx="10" fill="url(#box)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="270" y="133" text-anchor="middle">Runtime</text>
    <rect x="380" y="100" width="120" height="56" rx="10" fill="url(#box)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="440" y="133" text-anchor="middle">Tools</text>
    <rect x="540" y="100" width="120" height="56" rx="10" fill="url(#box)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="600" y="133" text-anchor="middle">Plugins</text>
    <rect x="700" y="100" width="140" height="56" rx="10" fill="url(#box)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="770" y="125" text-anchor="middle">Model</text>
    <text x="770" y="145" text-anchor="middle">providers</text>
    <rect x="380" y="200" width="200" height="48" rx="10" fill="url(#box)" stroke="#64748b" stroke-width="1"/>
    <text x="480" y="230" text-anchor="middle" fill="#94a3b8">Git · FS · Shell</text>
  </g>
  <line x1="160" y1="128" x2="198" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="128" x2="378" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="128" x2="538" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="128" x2="698" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="156" x2="440" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
